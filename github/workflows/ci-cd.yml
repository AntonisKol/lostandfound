name: Expo CI/CD

# Trigger on push to main or PRs targeting main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run TypeScript type check
      - name: TypeScript check
        run: npx tsc --noEmit

      # 5. Run ESLint
      - name: ESLint check
        run: npx eslint . --ext .ts,.tsx,.js,.jsx

      # 6. Run tests
      - name: Run tests
        run: npm test

  eas-build:
    name: EAS Build (Optional)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' # Only build on push to main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Login to Expo
        run: npx expo login -u ${{ secrets.EXPO_USERNAME }} -p ${{ secrets.EXPO_PASSWORD }}

      - name: EAS Build iOS
        run: npx eas build --platform ios --non-interactive

      - name: EAS Build Android
        run: npx eas build --platform android --non-interactive
